server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/template_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: root
    hikari:
      connection-timeout: 30000
      idle-timeout: 600000
      maximum-pool-size: 10
      minimum-idle: 5
      max-lifetime: 1800000
      connection-test-query: SELECT 1
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

# PDF 预览配置
template:
  pdf:
    font:
      path: 'C:\Windows\Fonts\simhei.ttf'
    cache:
      enabled: true
      ttl-minutes: 10

  # 智能匹配算法配置
  smart-match:
    async: true                    # true=异步(默认) false=同步
    python-path: python
    script-path: python/smart_train.py
    training-timeout-minutes: 10
    batch-size: 50

  # 模板训练功能配置
  train:
    python-path: python                     # Python 解释器路径
    timeout-minutes: 30                     # 训练超时时间
    api-base-url: http://localhost:3000     # API 基地址
    async: true                             # true=异步执行(默认)
    internal-token: train-internal-token    # 内部回调认证 Token

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.template.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
